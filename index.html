<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資概（資料庫）練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: single centered column, control-panel header + one question card at a time, number grid below */
:root{
  --bg:#eef0f5; --panel:#ffffff; --ink:#1a1f2e; --muted:#5c6378; --line:#d5d9e4;
  --accent:#7a4a0c; --accent-soft:#f3e7d6; --ok:#1f7a4a; --ok-soft:#dff1e6; --bad:#b4372b; --bad-soft:#f8e1de; --warn:#a86a00;
  --display:"Chakra Petch","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141c; --panel:#1b1e2a; --ink:#e4e6ee; --muted:#9aa0b5; --line:#2e3346;
  --accent:#e0a95a; --accent-soft:#3a2a14; --ok:#5cc58b; --ok-soft:#173326; --bad:#ef7a6c; --bad-soft:#3a1d1a; --warn:#e2a93b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --panel:#1b1e2a; --ink:#e4e6ee; --muted:#9aa0b5; --line:#2e3346;
  --accent:#e0a95a; --accent-soft:#3a2a14; --ok:#5cc58b; --ok-soft:#173326; --bad:#ef7a6c; --bad-soft:#3a1d1a; --warn:#e2a93b; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
.wrap{max-width:780px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-size:1.75rem;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:1.1rem;margin:0}
.eyebrow{font-family:var(--display);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:500;color:var(--muted);font-size:.85rem;white-space:nowrap}
td.num{white-space:nowrap;font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right}
.chip{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;font-weight:500}
.chip.ready{background:var(--ok-soft);color:var(--ok)}
.chip.wait{background:var(--line);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select{font:inherit}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
label.tog{display:flex;gap:8px;align-items:center;cursor:pointer}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--display);font-variant-numeric:tabular-nums}
.qtext{font-size:1.08rem;white-space:pre-line;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 14px;border-radius:8px;cursor:pointer;line-height:1.5}
.opt b{font-family:var(--display);min-width:1.3em;color:var(--muted)}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel b{color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.cell{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;padding:6px 0;font-family:var(--display);font-variant-numeric:tabular-nums;cursor:pointer;font-size:.9rem}
.cell.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.cell.cur{outline:2px solid var(--accent)}
.cell.r{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.w{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.score{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;background:var(--panel);font-size:.92rem}
.review{display:flex;flex-direction:column;gap:12px}
.ritem{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.ritem .ans{font-size:.92rem}
.ritem .ans .y{color:var(--bad)} .ritem .ans .c{color:var(--ok);font-weight:500}
.tag{font-family:var(--display);font-size:.8rem;color:var(--muted)}

.figs{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fig{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;padding:6px}
.ritem .fig{max-height:220px;width:auto}
#lkNo{width:5.5em;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
#lkNo:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lookup{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.lookup .opt{cursor:default}
.lookup .opt:hover{border-color:var(--line)}
.lookup .opt.right:hover{border-color:var(--ok)}
.opt span{white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.opt b{font-family:var(--body);font-weight:500;min-width:auto}
.opts.letters{flex-direction:row;flex-wrap:wrap}
.opts.letters .opt{flex:1 1 0;min-width:0;justify-content:center;padding-inline:6px}
.opts.tf{flex-direction:row}
.opts.tf .opt{flex:1 1 0;justify-content:center;font-size:1.15rem;padding:12px 6px}
.opts.tf .opt b{font-size:1.25rem;line-height:1.2}
.qtext.sm{font-size:1rem}
tr.tot td{font-weight:700;border-bottom:none}
.cell.chstart{box-shadow:inset 3px 0 0 var(--accent)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.9em;line-height:1.2;margin:0 2px}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
sub{font-size:.72em}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
img{max-width:100%}
.small{font-size:.88rem;margin:0}
#printMsg.err{color:var(--bad)}
#printMsg.ok{color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ico{display:inline-block;vertical-align:middle;height:auto;max-width:100%;margin:0 2px;background:#fff;border-radius:3px}
.fig,.ico{cursor:zoom-in}
#zoom{position:fixed;inset:0;background:rgba(10,12,20,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:6px;padding:8px;image-rendering:auto}
sup{font-size:.72em}
.rg{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.scroll{overflow-x:auto;max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.scroll table td,.scroll table th{padding:7px 10px}
.scroll thead th{position:sticky;top:0;background:var(--panel)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">題庫練習 · 共 163 題</div>
    <h1>資概（資料庫）練習</h1>
  </header>

  <section id="home" class="panel">
    <h2>題庫狀態</h2>
    <div class="scroll"><table><thead><tr><th>單元</th><th style="text-align:right">題號</th><th style="text-align:right">題數</th><th style="text-align:right">含圖題</th></tr></thead><tbody id="bankRows"></tbody></table></div>
    <h2 style="margin-top:6px">查看單題</h2>
    <div class="row">
      <select id="lkCh" aria-label="單元"></select>
      <span class="row" style="gap:6px;flex-wrap:nowrap"><label for="lkNo" class="muted">題號</label><input id="lkNo" type="number" min="1" value="1" inputmode="numeric"><span class="muted" id="lkMax"></span></span>
    </div>
    <div class="row">
      <button class="btn" id="lkPrev">上一題</button><button class="btn" id="lkNext">下一題</button>
      <label class="tog"><input type="checkbox" id="lkAns" checked> 顯示答案</label>
    </div>
    <div class="lookup" id="lkBox">
      <div class="tag" id="lkTag"></div>
      <p class="qtext" id="lkText"></p>
      <div class="figs" id="lkFig"></div>
      <div class="opts" id="lkOpts"></div>
    </div>
    <h2 style="margin-top:6px">開始練習</h2>
    <div class="row">
      <label for="mode" class="muted">模式</label>
      <select id="mode">
        <option value="full" id="modeFull">模擬測驗</option>
        <option value="ch">單元練習</option>
        <option value="range">自選範圍</option>
      </select>
      <select id="chSel" aria-label="單元" hidden></select>
      <select id="cnt" aria-label="題數" hidden>
        <option value="10">10 題</option><option value="20">20 題</option><option value="50">50 題</option><option value="0">全部</option>
      </select>
    </div>
    <div class="rg" id="rgBox" hidden>
      <select id="rgFrom" aria-label="起始單元"></select><span class="muted">到</span><select id="rgTo" aria-label="結束單元"></select>
      <select id="rgCnt" aria-label="題數"><option value="20">20 題</option><option value="50" selected>50 題</option><option value="100">100 題</option></select>
    </div>
    <label class="tog"><input type="checkbox" id="instant"> 作答後立即顯示正確答案</label>
    <label class="tog" id="shufWrap"><input type="checkbox" id="shuffleOpts"> 選項順序隨機（答案位置隨機）</label>
    <div class="row">
      <button class="btn primary" id="startBtn">開始出題</button>
      <button class="btn" id="printBtn">印製考卷</button>
      <select id="paperSel" aria-label="紙張大小"><option value="B4">B4</option><option value="A4">A4</option></select>
      <select id="fmtSel" aria-label="檔案格式"><option value="pdf">PDF</option><option value="docx">Word</option></select>
    </div>
    <p class="muted small" id="printMsg">印製考卷會依上方模式另抽一份新題目，輸出含答案頁的 PDF 或 Word 檔（Word 可再編輯）。</p>
  </section>

  <section id="quiz" class="panel" hidden>
    <div class="qhead"><span id="qPos"></span><span id="qCh" class="muted"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <p class="qtext" id="qText"></p>
    <div id="qFig" class="figs"></div>
    <div class="opts" id="opts"></div>
    <div class="row" style="justify-content:space-between">
      <div class="row"><button class="btn" id="prevBtn">上一題</button><button class="btn" id="nextBtn">下一題</button></div>
      <button class="btn primary" id="submitBtn">交卷</button>
    </div>
    <div id="confirmBox" class="warnbox" hidden>
      <span id="confirmMsg"></span>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="confirmYes">確定交卷</button><button class="btn" id="confirmNo">繼續作答</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="result" class="panel" hidden>
    <div class="eyebrow">成績</div>
    <div class="row" style="align-items:flex-end;gap:16px"><span class="score" id="score"></span><span class="muted" id="scoreSub"></span></div>
    <table><thead><tr><th>單元</th><th style="text-align:right">答對</th><th style="text-align:right">題數</th><th style="text-align:right">正確率</th></tr></thead><tbody id="chRows"></tbody></table>
    <div class="row">
      <button class="btn primary" id="retryWrong">重練錯題</button>
      <button class="btn" id="again">再出一份</button>
      <button class="btn" id="homeBtn">回首頁</button>
    </div>
    <h2>錯題檢討</h2>
    <div class="review" id="review"></div>
  </section>
</div>
<div id="zoom" hidden><img id="zoomImg" alt="放大圖片"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="exam-pdf.js" charset="utf-8"></script>
<script>

const plainOpt = h => h.replace(/<[^>]+>/g, "").trim();
function makePerm(q) {
  const id = q.o.map((_, i) => i);
  if (!$("shuffleOpts").checked || q.tf || q.io || !q.o.length) return id;
  const free = id.filter(i => !(PIN && PIN.test(plainOpt(q.o[i]))));
  const sh = shuffle(free), p = id.slice();
  free.forEach((pos, k) => { p[pos] = sh[k]; });
  return p;                                   // p[顯示位置] = 原選項索引
}
function view(q, p) {
  if (!p || q.tf || q.io) return q;
  return { ...q, o: p.map(i => q.o[i]), a: LET[p.indexOf(LET.indexOf(q.a))] };
}
const cq = i => view(DATA[paper[i]], perms[i]);

// 從多個單元平均抽題，順序依單元排列
function drawEven(unitIdx, total) {
  const per = unitIdx.map(() => Math.floor(total / unitIdx.length));
  let left = total - per.reduce((s, v) => s + v, 0);
  shuffle(unitIdx.map((_, i) => i)).slice(0, left).forEach(i => per[i]++);
  return drawPer(unitIdx, per);
}
function drawPer(unitIdx, per) {
  const out = [];
  unitIdx.forEach((u, i) => {
    const U = UNITS[u], ids = [];
    for (let k = U.from; k < U.to; k++) ids.push(k);
    shuffle(ids).slice(0, Math.min(per[i], ids.length)).sort((a, b) => a - b).forEach(qi => out.push(qi));
  });
  return out;
}

function renderHome() {
  $("bankRows").innerHTML = UNITS.map(u => {
    let f = 0; for (let k = u.from; k < u.to; k++) if (DATA[k].f.length || /<img/.test(DATA[k].s + DATA[k].o.join(""))) f++;
    return `<tr><td>${u.name}</td><td class="num">${u.range}</td><td class="num">${u.to - u.from}</td><td class="num">${f}</td></tr>`;
  }).join("") + `<tr class="tot"><td>合計</td><td class="num">${BY_UNIT ? "" : "1–" + DATA.length}</td><td class="num">${DATA.length}</td><td class="num">${DATA.filter(q => q.f.length || /<img/.test(q.s + q.o.join(""))).length}</td></tr>`;
  const opts = UNITS.map((u, i) => `<option value="${i}">${u.name}（${u.range}）</option>`).join("");
  $("chSel").innerHTML = opts; $("rgFrom").innerHTML = opts; $("rgTo").innerHTML = opts; $("lkCh").innerHTML = opts;
  $("rgTo").value = String(UNITS.length - 1);
  $("modeFull").textContent = FULL.mode === "per_unit"
    ? `模擬測驗（每單元 ${FULL.per} 題，共 ${FULL.per * UNITS.length} 題）`
    : `模擬測驗（全範圍 ${FULL.total} 題，各單元平均抽題）`;
  EXTRA.forEach((m, i) => {
    const o = document.createElement("option"); o.value = "x" + i;
    o.textContent = `${m.label}（共 ${m.per_unit.reduce((s, v) => s + v, 0)} 題）`;
    $("modeFull").after(o);
  });
  if (!SHUF) $("shufWrap").hidden = true;
  else $("shuffleOpts").checked = !!SHUF.default;
}

function buildPaper() {
  const m = $("mode").value;
  if (m === "full") {
    paperLabel = "ALL";
    if (FULL.mode === "per_unit") return [].concat(...UNITS.map((_, u) => drawEven([u], FULL.per)));
    return drawEven(UNITS.map((_, i) => i), FULL.total);
  }
  if (m[0] === "x") {
    paperLabel = "ALL";
    const per = EXTRA[+m.slice(1)].per_unit;
    return drawPer(per.map((_, i) => i).filter(i => i < UNITS.length), per);
  }
  if (m === "ch") {
    const u = +$("chSel").value, n = +$("cnt").value, U = UNITS[u], ids = [];
    for (let k = U.from; k < U.to; k++) ids.push(k);
    paperLabel = String(u + 1);
    return n ? shuffle(ids).slice(0, n) : shuffle(ids);
  }
  let a = +$("rgFrom").value, b = +$("rgTo").value; if (a > b) [a, b] = [b, a];
  const us = []; for (let i = a; i <= b; i++) us.push(i);
  paperLabel = a === b ? String(a + 1) : `${a + 1}-${b + 1}`;
  return drawEven(us, +$("rgCnt").value);
}

function start(list) {
  paper = list; perms = list.map(qi => makePerm(DATA[qi]));
  answers = new Array(list.length).fill(null); cur = 0; submitted = false;
  $("home").hidden = true; $("result").hidden = true; $("quiz").hidden = false; $("confirmBox").hidden = true;
  renderQ(); window.scrollTo(0, 0);
}

function renderQ() {
  const qi = paper[cur], q = cq(cur), instant = $("instant").checked;
  const reveal = submitted || (instant && answers[cur] !== null);
  $("qPos").textContent = `第 ${cur + 1} / ${paper.length} 題`;
  $("qCh").textContent = `${UNITS[unitOf(qi)].name} · 題號 ${numOf(qi)}`;
  $("prog").style.width = (answers.filter(a => a !== null).length / paper.length * 100) + "%";
  $("qText").innerHTML = q.s;
  $("qFig").innerHTML = figs(q);
  $("opts").className = q.tf ? "opts tf" : q.io ? "opts letters" : "opts";
  $("opts").innerHTML = letters(q).map(l => {
    let cls = "opt";
    if (answers[cur] === l) cls += " sel";
    if (reveal) { if (l === q.a) cls += " right"; else if (answers[cur] === l) cls += " wrong"; }
    return `<button class="${cls}" data-l="${l}" ${reveal ? "disabled" : ""}><b>${optMark(q, l)}</b><span>${optInner(q, l)}</span></button>`;
  }).join("");
  $("prevBtn").disabled = cur === 0; $("nextBtn").disabled = cur === paper.length - 1;
  $("grid").innerHTML = paper.map((qj, i) => {
    let c = "cell"; const qq = cq(i);
    if (submitted || (instant && answers[i] !== null)) c += answers[i] === qq.a ? " r" : (answers[i] !== null ? " w" : "");
    else if (answers[i] !== null) c += " done";
    if (i === cur) c += " cur";
    return `<button class="${c}" data-i="${i}" title="${UNITS[unitOf(qj)].name}">${i + 1}</button>`;
  }).join("");
}

$("opts").addEventListener("click", e => {
  const b = e.target.closest(".opt"); if (!b || b.disabled) return;
  answers[cur] = b.dataset.l; renderQ();
  if (!$("instant").checked && cur < paper.length - 1) setTimeout(() => { cur++; renderQ(); }, 180);
});
$("grid").addEventListener("click", e => { const b = e.target.closest(".cell"); if (!b) return; cur = +b.dataset.i; renderQ(); });
$("prevBtn").onclick = () => { if (cur > 0) { cur--; renderQ(); } };
$("nextBtn").onclick = () => { if (cur < paper.length - 1) { cur++; renderQ(); } };
document.addEventListener("keydown", e => {
  if ($("quiz").hidden || /SELECT|INPUT/.test(e.target.tagName)) return;
  let k = e.key.toUpperCase();
  if (DATA[paper[cur]].tf) k = ({ O: "O", X: "X", A: "O", B: "X", "1": "O", "2": "X" })[k] || "";
  if (k && "ABCDEOX".includes(k)) { const b = document.querySelector(`#opts .opt[data-l="${k}"]`); if (b && !b.disabled) b.click(); }
  else if (e.key === "ArrowRight") $("nextBtn").click();
  else if (e.key === "ArrowLeft") $("prevBtn").click();
});
$("submitBtn").onclick = () => {
  const left = answers.filter(a => a === null).length;
  if (left) { $("confirmMsg").textContent = `還有 ${left} 題未作答，未作答視為答錯。`; $("confirmBox").hidden = false; }
  else finish();
};
$("confirmNo").onclick = () => { $("confirmBox").hidden = true; };
$("confirmYes").onclick = finish;

function finish() {
  submitted = true; $("quiz").hidden = true; $("result").hidden = false; window.scrollTo(0, 0);
  let right = 0; const per = {}; const wrong = [];
  paper.forEach((qi, i) => {
    const q = cq(i), u = unitOf(qi); per[u] = per[u] || { r: 0, n: 0 }; per[u].n++;
    if (answers[i] === q.a) { right++; per[u].r++; } else wrong.push({ qi, i, q });
  });
  $("score").textContent = Math.round(right / paper.length * 100);
  $("scoreSub").textContent = `分 · 答對 ${right} / ${paper.length} 題`;
  $("chRows").innerHTML = Object.keys(per).sort((a, b) => a - b).map(u => { const s = per[u]; return `<tr><td>${UNITS[u].name}</td><td class="num">${s.r}</td><td class="num">${s.n}</td><td class="num">${Math.round(s.r / s.n * 100)}%</td></tr>`; }).join("");
  $("retryWrong").disabled = !wrong.length;
  $("retryWrong").onclick = () => start(shuffle(wrong.map(w => w.qi)));
  const optTxt = (q, l) => q.tf ? `${TF[l]}（${TFW[l]}）` : `（${l}）${optInner(q, l)}`;
  $("review").innerHTML = wrong.length ? wrong.map(w => {
    const a = answers[w.i];
    const opts = (w.q.tf || w.q.io) ? "" : `<div class="muted small">${letters(w.q).map(l => `（${l}）${optInner(w.q, l)}`).join("　")}</div>`;
    return `<div class="ritem"><span class="tag">第 ${w.i + 1} 題 · ${UNITS[unitOf(w.qi)].name} · 題號 ${numOf(w.qi)}</span><div class="qtext sm">${w.q.s}</div>${figs(w.q)}${opts}
      <div class="ans">你的答案：<span class="y">${a ? optTxt(w.q, a) : "未作答"}</span><br>正確答案：<span class="c">${optTxt(w.q, w.q.a)}</span></div></div>`;
  }).join("") : `<p class="muted">全部答對。</p>`;
}

function syncMode() {
  const m = $("mode").value;
  $("chSel").hidden = $("cnt").hidden = m !== "ch";
  $("rgBox").hidden = m !== "range";
}
$("mode").onchange = syncMode;
$("startBtn").onclick = () => start(buildPaper());
$("again").onclick = () => start(buildPaper());
$("homeBtn").onclick = () => { $("result").hidden = true; $("home").hidden = false; };

// ---- 查看單題（依題號，原始選項順序）----
function renderLookup() {
  // 題號：全卷連續編號時是 1～總題數；每單元各自編號時是該單元的 1～題數
  let u0 = +$("lkCh").value || 0;
  const lo = 1, hi = BY_UNIT ? UNITS[u0].to - UNITS[u0].from : DATA.length;
  let n = Math.round(+$("lkNo").value) || 1; n = Math.min(Math.max(n, lo), hi); $("lkNo").value = n;
  const qi = BY_UNIT ? UNITS[u0].from + n - 1 : n - 1;
  const q = DATA[qi], show = $("lkAns").checked, u = unitOf(qi);
  $("lkCh").value = String(u);
  $("lkMax").textContent = `（共 ${hi} 題）`;
  $("lkTag").textContent = `${UNITS[u].name} · 題號 ${numOf(qi)}` + (show ? ` · 答案（${ansText(q)}）` : "");
  $("lkText").innerHTML = q.s; $("lkFig").innerHTML = figs(q);
  $("lkOpts").className = q.tf ? "opts tf" : q.io ? "opts letters" : "opts";
  $("lkOpts").innerHTML = letters(q).map(l => `<div class="opt${show && l === q.a ? " right" : ""}"><b>${optMark(q, l)}</b><span>${optInner(q, l)}</span></div>`).join("");
  $("lkPrev").disabled = n === 1; $("lkNext").disabled = n === hi;
}
$("lkCh").onchange = () => { $("lkNo").value = BY_UNIT ? 1 : UNITS[+$("lkCh").value].from + 1; renderLookup(); };
$("lkNo").oninput = renderLookup;
$("lkAns").onchange = renderLookup;
$("lkPrev").onclick = () => { $("lkNo").value = +$("lkNo").value - 1; renderLookup(); };
$("lkNext").onclick = () => { $("lkNo").value = +$("lkNo").value + 1; renderLookup(); };

// ---- 印製考卷 ----
let fontCache = null;
async function loadFont() {
  if (fontCache) return fontCache;
  const [b, j] = await Promise.all([
    fetch("font/tc.ttf").then(r => { if (!r.ok) throw new Error("font"); return r.arrayBuffer(); }),
    fetch("font/tc.json").then(r => r.json())]);
  return fontCache = { bytes: new Uint8Array(b), font: j };
}
const jpegCache = {};
function imgToJpeg(src) {
  if (jpegCache[src]) return jpegCache[src];
  return jpegCache[src] = new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0);
      c.toBlob(async b => { if (!b) return rej(new Error("img")); res(new Uint8Array(await b.arrayBuffer())); }, "image/jpeg", 0.92);
    };
    im.onerror = () => rej(new Error("img")); im.src = src;
  });
}
function setMsg(t, cls) { const m = $("printMsg"); m.textContent = t; m.className = "muted small" + (cls ? " " + cls : ""); }
const MIME = { pdf: "application/pdf", docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" };
async function saveFile(filename, bytes, fmt = "pdf") {
  const blob = bytes instanceof Blob ? bytes : new Blob([bytes], { type: MIME[fmt] });
  const dl = window.claude?.use ? await window.claude.use("downloads") : null;
  if (dl) { await dl.save({ filename, data: blob }); return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
// Word 產生器只在第一次選 Word 時載入
const DOCX_SRC = ["https://cdn.jsdelivr.net/npm/docx@9.15.3/dist/index.iife.min.js", "exam-docx.js"];
let docxReady = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.charset = "utf-8"; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.appendChild(s); });
}
function loadDocx() {
  return docxReady = docxReady || (async () => { for (const src of DOCX_SRC) await loadScript(src); if (!window.docx || !window.ExamDOCX) throw new Error("docx"); })()
    .catch(e => { docxReady = null; throw e; });
}
$("printBtn").onclick = async () => {
  const btn = $("printBtn"); if (btn.disabled) return;
  const fmt = $("fmtSel").value;
  if (!window.ExamPDF || (fmt === "pdf" && !window.PDFLib)) { setMsg("PDF 元件載入失敗，請重新整理頁面後再試。", "err"); return; }
  btn.disabled = true; setMsg(fmt === "docx" ? "正在產生 Word 考卷…" : "正在產生考卷…");
  try {
    if (fmt === "docx") {
      try { await loadDocx(); } catch (e) { setMsg("Word 元件載入失敗，請確認網路連線後再試。", "err"); return; }
    }
    const list = buildPaper();
    const items = [];
    for (const qi of list) {
      const q = view(DATA[qi], makePerm(DATA[qi]));
      const imgs = [];
      for (const [f, wh] of q.f) imgs.push({ bytes: await imgToJpeg("img/" + f), w: wh[0], h: wh[1] });
      const inl = {};
      for (const m of (q.s + q.o.join("")).matchAll(/<img class="ico" src="([^"]+)" alt="" data-w="([\d.]+)" data-h="([\d.]+)"[^>]*>/g))
        inl[m[1]] = { bytes: await imgToJpeg(m[1]), w: +m[2], h: +m[3] };
      items.push({ stem: q.s, opts: q.o, ans: ansText(q), imgs, inl, imgOpts: !!(q.io || q.tf), ref: q.r || String(qi + 1) });
    }
    const opt = { items, chLabel: paperLabel, paper: $("paperSel").value, title: CONFIG.exam_name };
    let out;
    if (fmt === "docx") out = await ExamDOCX.build({ ...opt, docx: window.docx, toRuns: ExamPDF.toRuns });
    else { const { bytes: fontBytes, font } = await loadFont(); out = await ExamPDF.build({ ...opt, PDFLib, fontBytes, font }); }
    const d = new Date(), z = n => String(n).padStart(2, "0");
    const filename = `${CONFIG.exam_name}_Ch${paperLabel}_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.${fmt}`;
    try { await saveFile(filename, out, fmt); setMsg(`已輸出 ${filename}（${items.length} 題＋答案頁）。`, "ok"); }
    catch (e) { setMsg(e && e.code === "declined" ? "已取消下載。" : "下載失敗，請稍後再試。", e && e.code === "declined" ? "" : "err"); }
  } catch (e) { console.error(e); setMsg("產生考卷時發生錯誤，請重新整理頁面後再試。", "err"); }
  finally { btn.disabled = false; }
};

// 點圖片放大（手機上看小圖）
document.addEventListener("click", e => {
  const im = e.target.closest(".fig, .ico");
  if (im && !e.target.closest(".opt:not(.lookup .opt)")) { $("zoomImg").src = im.src; $("zoom").hidden = false; e.preventDefault(); return; }
  if (e.target.closest("#zoom")) $("zoom").hidden = true;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("zoom").hidden = true; });

renderHome(); syncMode(); renderLookup();
</script>
</body>
